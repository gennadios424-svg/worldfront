name: Simulation regression
# Regression coverage for navigation, river barriers, bridges, fishing and population balance.
on:
  push:
    branches: [feature/living-medieval-colonies, audit/restore-settlement-simulation, fix/horse-export-conditions, feature/civilization-logistics-revolutions, fix/storage-horse-church-expansion, feature/human-lifecycle-recruitment, fix/natural-navigation-fishing-expansion]
  workflow_dispatch:
jobs:
  year-14-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/simulation-regression.mjs
