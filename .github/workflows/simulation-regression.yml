name: Simulation regression
# Regression coverage for navigation, river barriers, bridges, fishing, population balance and expansion, with bounded route search and retry throttling and performance caps and stable approach points and a capped fishing workforce and clearing construction sites and border-crossing settlers and stuck-expedition recovery and per-country blocker reporting and guaranteed retry decisions and food-supported recruitment and deterministic building-site search, lower bridge costs and claim diagnostics and build failure reasons and bridge builder recovery and abandoned construction reassignment and fishing diagnostics and horse river crossings and unique test fixture names and realistic travel durations and affordable settlement kits.
on:
  push:
    branches: [feature/living-medieval-colonies, audit/restore-settlement-simulation, fix/horse-export-conditions, feature/civilization-logistics-revolutions, fix/storage-horse-church-expansion, feature/human-lifecycle-recruitment, fix/natural-navigation-fishing-expansion]
  workflow_dispatch:
jobs:
  year-14-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/simulation-regression.mjs
