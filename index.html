<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10202a"><title>Worldfront — Living Nations</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10202a;color:#edf4f5;font:14px Inter,Segoe UI,Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;cursor:grab}canvas.drag{cursor:grabbing}.hud{position:fixed;z-index:3;top:15px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-weight:950;letter-spacing:2px;font-size:13px;text-shadow:0 2px 8px #000}.brand b{color:#a9e0bd}.right{display:flex;gap:9px;align-items:center;pointer-events:auto}.pill{background:#0d1b22dc;border:1px solid #56706c;border-radius:20px;padding:8px 12px;font-size:10px;font-weight:800;letter-spacing:1px}.gear{width:40px;height:40px;border:1px solid #688079;border-radius:50%;background:#10232bdc;color:#fff;font-size:19px;cursor:pointer}.panel{display:none;position:fixed;z-index:5;right:18px;top:66px;width:285px;background:#101f27f5;border:1px solid #526b69;border-radius:12px;padding:15px;box-shadow:0 14px 45px #0009}.panel.open{display:block}.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:1px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff18;font-size:12px}.panel button{margin-top:12px;background:#29434a;color:#fff;border:1px solid #5a777a;padding:8px 11px;border-radius:7px;cursor:pointer}.hint{position:fixed;bottom:14px;left:16px;padding:8px 11px;border:1px solid #ffffff24;border-radius:8px;background:#0c1a20bd;color:#d5e3df;font-size:10px;pointer-events:none}.selection{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;background:#0d1b22eF;border:1px solid #5c7770;border-radius:10px;padding:10px 15px;min-width:190px;text-align:center;pointer-events:none}.selection.show{display:block}.selection strong{display:block;font-size:12px;letter-spacing:1px}.selection small{color:#b8c9c3;font-size:10px}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#10232beF;border:1px solid #71877c;border-radius:20px;padding:8px 13px;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:600px){.brand{font-size:11px}.hint{max-width:85vw;font-size:9px}.pill{font-size:9px;padding:7px 9px}}
</style></head><body>
<canvas id="world"></canvas>
<div class="hud"><div class="brand">WORLD<b>FRONT</b> <span style="color:#d5e2dc">/ LIVING WORLD</span></div><div class="right"><div class="pill" id="clock">WORLD SIMULATION · YEAR 1</div><button class="gear" id="gear" aria-label="Settings">⚙</button></div></div>
<div class="panel" id="panel"><h3>WORLD CONTROLS</h3><div id="stats"></div><button id="pause">Pause simulation</button><button id="reset">Restart world</button><p style="font-size:10px;color:#aebfba;line-height:1.5">Stage 1: territories, countryball movement and camera. Drag to move the map. Scroll to zoom.</p></div>
<div class="hint">DRAG TO MOVE · SCROLL TO ZOOM · CLICK A COUNTRYBALL TO INSPECT</div><div class="selection" id="selection"></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const cv=document.getElementById('world'),c=cv.getContext('2d'),clock=document.getElementById('clock'),panel=document.getElementById('panel'),stats=document.getElementById('stats'),selection=document.getElementById('selection'),toast=document.getElementById('toast');
const MW=3200,MH=2200,teams=[],rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let dpr=1,W=0,H=0,cam={x:MW/2,y:MH/2,z:.62},drag=null,paused=false,year=1,sim=0,selected=-1,toastTimer=0,last=0,territoryLayer=document.createElement('canvas'),tc=territoryLayer.getContext('2d');
const nations=[{name:'AURELIA',color:'#d75d58',dark:'#823b3b',capital:{x:930,y:900},seed:11},{name:'VESTMARK',color:'#5599dc',dark:'#2e5b88',capital:{x:2180,y:820},seed:23},{name:'SOLMERE',color:'#55ad83',dark:'#2c7657',capital:{x:1020,y:1600},seed:37},{name:'KARTH',color:'#d8b94e',dark:'#8e722d',capital:{x:2240,y:1540},seed:49}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';c.setTransform(dpr,0,0,dpr,0,0);cam.z=clamp(cam.z,.28,1.5);draw()}
function noise(x,y,s){return Math.sin(x*.013+s)*Math.cos(y*.017+s*1.7)+.45*Math.sin((x+y)*.009+s*2)}
function landAt(x,y){const continents=[{x:1570,y:1060,rx:1350,ry:760},{x:560,y:470,rx:430,ry:290},{x:2730,y:430,rx:350,ry:270},{x:2670,y:1850,rx:430,ry:250},{x:420,y:1850,rx:330,ry:190}];return continents.some((p,i)=>{const n=noise(x,y,i*3);const dx=(x-p.x)/(p.rx*(1+n*.07)),dy=(y-p.y)/(p.ry*(1+n*.07));return dx*dx+dy*dy<1})}
function makeTerrain(){territoryLayer.width=MW;territoryLayer.height=MH;tc.clearRect(0,0,MW,MH);const step=12;for(let y=0;y<MH;y+=step)for(let x=0;x<MW;x+=step){if(!landAt(x,y))continue;const n=noise(x,y,8);tc.fillStyle=n>.55?'#8b9a70':n<-.55?'#b5aa7c':'#9eaa7d';tc.fillRect(x,y,step+1,step+1)}}
function makeTerritory(t){const circles=[{x:t.capital.x,y:t.capital.y,r:235}];return circles}
function teamTerritoryPath(t){const points=[];const n=160;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let radius=220+Math.sin(a*3+t.seed)*26+Math.sin(a*7+t.seed*2)*13+Math.cos(a*11+t.seed)*8;for(const p of t.outposts){const dx=Math.cos(a),dy=Math.sin(a),px=p.x-t.capital.x,py=p.y-t.capital.y,along=px*dx+py*dy,side=Math.abs(px*dy-py*dx);if(along>0&&side<75)radius=Math.max(radius,along+75)}points.push({x:t.capital.x+Math.cos(a)*radius,y:t.capital.y+Math.sin(a)*radius})}return points}
function path(points){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath()}
function init(){teams.length=0;nations.forEach(n=>teams.push({...n,outposts:[],ball:{x:n.capital.x,y:n.capital.y,angle:0,target:null,wait:0},territory:[],population:500,army:0,civilians:[],buildings:[],buildTimer:0,buildingSerial:0}));for(const t of teams){t.territory=teamTerritoryPath(t);const golden=Math.PI*(3-Math.sqrt(5));for(let i=0;i<500;i++){const r=18+Math.sqrt(i/500)*155,a=i*golden+t.seed,x=t.capital.x+Math.cos(a)*r,y=t.capital.y+Math.sin(a)*r;t.civilians.push({id:i,x,y,tx:x+rand(-25,25),ty:y+rand(-25,25),speed:34+rand(0,22),task:-1})}const cap={id:t.buildingSerial++,type:'capital',x:t.capital.x,y:t.capital.y,progress:0,workers:[],radius:33};for(let i=0;i<22;i++){cap.workers.push(i);t.civilians[i].task=cap.id;t.civilians[i].tx=cap.x+rand(-18,18);t.civilians[i].ty=cap.y+rand(-18,18)}t.buildings.push(cap)}makeTerrain();cam={x:MW/2,y:MH/2,z:.62};year=1;sim=0;selected=-1;selection.classList.remove('show');notify('2,000 individual civilians spawned. Capital construction started.')}
function notify(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}
function inside(t,x,y){const pts=t.territory;let hit=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))hit=!hit}return hit}
function chooseFrontier(t){let best=null,bscore=-1e9;const frontier=260+Math.min(560,t.outposts.length*58);for(let k=0;k<70;k++){const a=rand(0,Math.PI*2),r=rand(Math.max(190,frontier-75),frontier+55);const p={x:t.capital.x+Math.cos(a)*r,y:t.capital.y+Math.sin(a)*r};if(!landAt(p.x,p.y))continue;let blocked=false;for(const other of teams)if(other!==t&&inside(other,p.x,p.y)){blocked=true;break}if(blocked)continue;let score=rand(0,1)-Math.hypot(p.x-t.ball.x,p.y-t.ball.y)*.001;if(score>bscore){bscore=score;best=p}}return best}
function civilianTarget(t,x0,y0){for(let k=0;k<35;k++){const a=rand(0,Math.PI*2),r=rand(35,205),x=t.capital.x+Math.cos(a)*r,y=t.capital.y+Math.sin(a)*r;if(!landAt(x,y)||!inside(t,x,y)||teams.some(o=>o!==t&&inside(o,x,y))||Math.hypot(x-x0,y-y0)<22)continue;return{x,y}}return{x:t.capital.x+rand(-55,55),y:t.capital.y+rand(-55,55)}}
function createBuilding(t,type){for(let k=0;k<45;k++){const p=civilianTarget(t,t.capital.x,t.capital.y);if(t.buildings.some(b=>Math.hypot(b.x-p.x,b.y-p.y)<48))continue;const b={id:t.buildingSerial++,type,x:p.x,y:p.y,progress:0,workers:[],radius:type==='factory'?17:11};const available=t.civilians.filter(v=>v.task<0);for(let i=0;i<Math.min(type==='factory'?9:6,available.length);i++){const v=available[(i*37+t.buildingSerial*13)%available.length];v.task=b.id;v.tx=p.x+rand(-20,20);v.ty=p.y+rand(-20,20);b.workers.push(v.id)}t.buildings.push(b);return}}
function update(dt){if(paused)return;sim+=dt;year=1+Math.floor(sim/60);for(const t of teams){const b=t.ball;b.wait-=dt;if(!b.target||Math.hypot(b.target.x-b.x,b.target.y-b.y)<18||b.wait<=0){b.target=chooseFrontier(t);b.wait=rand(10,18)}if(b.target){const dx=b.target.x-b.x,dy=b.target.y-b.y,d=Math.hypot(dx,dy)||1;b.angle=Math.atan2(dy,dx);const step=Math.min(d,dt*24),nx=b.x+dx/d*step,ny=b.y+dy/d*step;if(landAt(nx,ny)&&!teams.some(o=>o!==t&&inside(o,nx,ny))){b.x=nx;b.y=ny}else{b.target=null;b.wait=1}}if(b.target&&Math.hypot(b.target.x-b.x,b.target.y-b.y)<20){const p={x:b.x,y:b.y};if(!t.outposts.some(o=>Math.hypot(o.x-p.x,o.y-p.y)<130)){const old=t.outposts;t.outposts=[...old,p];const next=teamTerritoryPath(t);let valid=true;for(let j=0;j<next.length;j++)if(teams.some(o=>o!==t&&inside(o,next[j].x,next[j].y))){valid=false;break}if(valid)for(const o of teams)if(o!==t&&(inside({territory:next},o.capital.x,o.capital.y)||o.outposts.some(p=>inside({territory:next},p.x,p.y)))){valid=false;break}if(valid)t.territory=next;else t.outposts=old}}}
for(const t of teams){for(const v of t.civilians){if(v.task>=0){const b=t.buildings.find(x=>x.id===v.task);if(!b||b.progress>=1){v.task=-1;const p=civilianTarget(t,v.x,v.y);v.tx=p.x;v.ty=p.y}}if(v.task<0&&Math.hypot(v.tx-v.x,v.ty-v.y)<9){const p=civilianTarget(t,v.x,v.y);v.tx=p.x;v.ty=p.y}const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy)||1,step=Math.min(d,v.speed*dt),nx=v.x+dx/d*step,ny=v.y+dy/d*step;let blocked=!landAt(nx,ny)||!inside(t,nx,ny)||teams.some(o=>o!==t&&inside(o,nx,ny));if(!blocked)for(const b of t.buildings)if(Math.hypot(nx-b.x,ny-b.y)<b.radius+4&&v.task!==b.id){blocked=true;break}if(blocked){const p=civilianTarget(t,v.x,v.y);v.tx=p.x;v.ty=p.y}else{v.x=nx;v.y=ny}}
for(const b of t.buildings)if(b.progress<1){let present=0;for(const id of b.workers){const v=t.civilians[id];if(v&&Math.hypot(v.x-b.x,v.y-b.y)<38)present++}b.progress=Math.min(1,b.progress+dt*present*(b.type==='capital'?.0025:.0045))}
t.buildTimer+=dt;if(t.buildings[0].progress>=1&&t.buildTimer>10){const houses=t.buildings.filter(b=>b.type==='house').length,factories=t.buildings.filter(b=>b.type==='factory').length;if(houses<12&&t.buildTimer>10+houses*7){createBuilding(t,'house');t.buildTimer=10+houses*7}else if(factories<4&&houses>=3&&t.buildTimer>35+factories*24){createBuilding(t,'factory');t.buildTimer=35+factories*24}}}}
function worldPoint(sx,sy){return{x:cam.x+(sx-W/2)/cam.z,y:cam.y+(sy-H/2)/cam.z}}
function screenPoint(x,y){return{x:(x-cam.x)*cam.z+W/2,y:(y-cam.y)*cam.z+H/2}}
function drawBall(x,y,t,scale=1){c.save();c.translate(x,y);c.scale(scale,scale);c.shadowColor='#0009';c.shadowBlur=8;c.shadowOffsetY=4;c.beginPath();c.arc(0,0,19,0,Math.PI*2);c.fillStyle=t.color;c.fill();c.lineWidth=3;c.strokeStyle='#f1eee2';c.stroke();c.shadowColor='transparent';c.shadowBlur=0;c.shadowOffsetY=0;c.fillStyle='#fff';c.beginPath();c.ellipse(-6,-3,4.1,5.2,0,0,7);c.ellipse(6,-3,4.1,5.2,0,0,7);c.fill();c.fillStyle='#202329';c.beginPath();c.arc(-5,-2,1.7,0,7);c.arc(7,-2,1.7,0,7);c.fill();c.strokeStyle='#29201d';c.lineWidth=2;c.beginPath();c.moveTo(-6,8);c.quadraticCurveTo(0,12,6,8);c.stroke();c.restore()}
function drawCapital(t){for(const b of t.buildings){c.save();c.translate(b.x,b.y);c.globalAlpha=.35+.65*b.progress;c.fillStyle='#36453d';c.beginPath();c.ellipse(0,9,b.radius+8,7,0,0,7);c.fill();if(b.type==='capital'){c.fillStyle='#d8d2b9';c.fillRect(-22,-16,44,25);c.fillStyle=t.dark;c.fillRect(-25,-21,50,7);c.fillStyle='#f1e9d1';c.fillRect(-5,-9,10,18);c.fillStyle=t.color;c.fillRect(-2,-40,3,20);c.beginPath();c.moveTo(1,-40);c.lineTo(17,-35);c.lineTo(1,-30);c.fill()}else if(b.type==='factory'){c.fillStyle='#727c78';c.fillRect(-17,-13,34,22);c.fillStyle='#525e5b';c.fillRect(5,-25,7,13);c.fillStyle='#c7c9b8';c.fillRect(-12,-7,7,8);c.fillRect(1,-7,7,8)}else{c.fillStyle='#d7c8a6';c.fillRect(-11,-10,22,18);c.fillStyle=t.dark;c.beginPath();c.moveTo(-14,-10);c.lineTo(0,-21);c.lineTo(14,-10);c.fill();c.fillStyle='#766b55';c.fillRect(-3,0,6,8)}if(b.progress<1){c.strokeStyle='#f5e5ad';c.lineWidth=2;c.beginPath();c.arc(0,0,b.radius+5,-Math.PI/2,-Math.PI/2+Math.PI*2*b.progress);c.stroke()}c.restore()}c.fillStyle='#f4f0dc';c.font='bold 12px Arial';c.textAlign='center';c.fillText(t.name,t.capital.x,t.capital.y+55)}
function draw(){c.clearRect(0,0,W,H);c.fillStyle='#183746';c.fillRect(0,0,W,H);c.save();c.translate(W/2-cam.x*cam.z,H/2-cam.y*cam.z);c.scale(cam.z,cam.z);c.drawImage(territoryLayer,0,0);c.strokeStyle='#274a4b';c.lineWidth=3;for(let i=0;i<110;i++){const x=(i*317)%MW,y=(i*719)%MH;if(landAt(x,y)){const n=noise(x,y,19);c.beginPath();c.ellipse(x,y,5+n*3,3+n*2,i*.31,0,7);c.stroke()}}for(const t of teams){path(t.territory);c.fillStyle=t.color+'35';c.fill();c.lineWidth=5;c.strokeStyle=t.color;c.stroke();c.lineWidth=1.5;c.strokeStyle='#f4edcf';c.setLineDash([7,8]);c.stroke();c.setLineDash([]);for(const p of t.outposts){c.fillStyle=t.dark;c.beginPath();c.arc(p.x,p.y,7,0,7);c.fill();c.strokeStyle='#e8e4d1';c.lineWidth=2;c.stroke()}drawCapital(t);const dotR=Math.max(1.35/cam.z,2.15);c.fillStyle=t.color;for(const v of t.civilians){if(v.x<cam.x-W/cam.z||v.x>cam.x+W/cam.z||v.y<cam.y-H/cam.z||v.y>cam.y+H/cam.z)continue;c.globalAlpha=.92;c.beginPath();c.arc(v.x,v.y,dotR,0,Math.PI*2);c.fill()}c.globalAlpha=1;drawBall(t.ball.x,t.ball.y,t,1.05)}c.restore();if(selected>=0){const t=teams[selected];const p=screenPoint(t.capital.x,t.capital.y);c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,29,0,7);c.stroke()}}
function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;update(dt);draw();clock.textContent='YEAR '+year+' · '+teams.reduce((n,t)=>n+t.civilians.length,0).toLocaleString()+' CIVILIANS';requestAnimationFrame(frame)}
function inspect(i){selected=i;const t=teams[i];selection.innerHTML='<strong style="color:'+t.color+'">'+t.name+'</strong><small>Capital established · '+t.outposts.length+' frontier outposts · Territory expanding</small>';selection.classList.add('show');draw()}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};cv.setPointerCapture(e.pointerId);cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;cam.x=clamp(drag.cx-dx/cam.z,0,MW);cam.y=clamp(drag.cy-dy/cam.z,0,MH)});
cv.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){const p=worldPoint(e.clientX,e.clientY);let hit=-1,bd=Infinity;teams.forEach((t,i)=>{const d=Math.hypot(p.x-t.ball.x,p.y-t.ball.y);if(d<42/cam.z&&d<bd){hit=i;bd=d}});if(hit>=0)inspect(hit);else{selected=-1;selection.classList.remove('show')}}drag=null;cv.classList.remove('drag')});
cv.addEventListener('wheel',e=>{e.preventDefault();const before=worldPoint(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.exp(-e.deltaY*.001),.22,1.8);const after=worldPoint(e.clientX,e.clientY);cam.x+=before.x-after.x;cam.y+=before.y-after.y},{passive:false});
document.getElementById('gear').onclick=()=>{panel.classList.toggle('open');stats.innerHTML=teams.map(t=>'<div class="row"><span style="color:'+t.color+'">'+t.name+'</span><span>'+t.outposts.length+' outposts</span></div>').join('')};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume simulation':'Pause simulation'};
document.getElementById('reset').onclick=init;addEventListener('resize',resize);init();resize();requestAnimationFrame(frame);
})();
</script></body></html>
