*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10202a;color:#edf4f5;font:14px Inter,Segoe UI,Arial,sans-serif}canvas{display:block;width:100vw;height:100vh;cursor:grab}canvas.drag{cursor:grabbing}.hud{position:fixed;z-index:3;top:15px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-weight:950;letter-spacing:2px;font-size:13px;text-shadow:0 2px 8px #000}.brand b{color:#a9e0bd}.right{display:flex;gap:9px;align-items:center;pointer-events:auto}.pill{background:#0d1b22dc;border:1px solid #56706c;border-radius:20px;padding:8px 12px;font-size:10px;font-weight:800;letter-spacing:1px} .speedbar{display:flex;gap:4px;background:#0d1b22dc;border:1px solid #56706c;border-radius:20px;padding:3px}.speedbar button{border:0;border-radius:14px;background:transparent;color:#d6e4df;padding:6px 9px;font-size:10px;font-weight:900;cursor:pointer}.speedbar button.active{background:#a9e0bd;color:#10202a}.gear{width:40px;height:40px;border:1px solid #688079;border-radius:50%;background:#10232bdc;color:#fff;font-size:19px;cursor:pointer}.panel{display:none;position:fixed;z-index:5;right:18px;top:66px;width:285px;background:#101f27f5;border:1px solid #526b69;border-radius:12px;padding:15px;box-shadow:0 14px 45px #0009}.panel.open{display:block}.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:1px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ffffff18;font-size:12px}.panel button{margin-top:12px;background:#29434a;color:#fff;border:1px solid #5a777a;padding:8px 11px;border-radius:7px;cursor:pointer}.hint{position:fixed;bottom:14px;left:16px;padding:8px 11px;border:1px solid #ffffff24;border-radius:8px;background:#0c1a20bd;color:#d5e3df;font-size:10px;pointer-events:none}.selection{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;background:#0d1b22eF;border:1px solid #5c7770;border-radius:10px;padding:10px 15p <canvas id="world"></canvas>
<div class="hud"><div class="brand">WORLD<b>FRONT</b> <span style="color:#d5e2dc">/ LIVING WORLD</span></div><div class="right"><div class="pill" id="clock">WORLD SIMULATION · YEAR 1</div><div class="speedbar" id="speedbar"><button data-speed="1" class="active">1X</button><button data-speed="2">2X</button><button data-speed="5">5X</button><button data-speed="10">10X</button></div><button class="gear" id="gear" aria-label="Settings">⚙</button></div></div>
<div class="panel" id="panel"><h3>WORLD CONTROLS</h3><div id="stats"></div><button id="pause">Pause simulation</button><button id="reset">Restart world</button><p style="font-size:10px;color:#aebfba;line-height:1.5">Stage 1: territories, countryball movement and camera. Drag to move the map. Scroll to zoom.</p></div>

<script>
(()=>{'use strict';
const cv=document.getElementById('world'),c=cv.getContext('2d'),clock=document.getElementById('clock'),panel=document.getElementById('panel'),stats=document.getElementById('stats'),selection=document.getElementById('selection'),toast=document.getElementById('toast');
const MW=3200,MH=2200,teams=[],rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let dpr=1,W=0,H=0,simulationSpeed=1,simAccumulator=0,cityRefresh=0,cam={x:MW/2,y:MH/2,z:.62},drag=null,paused=false,year=1,sim=0,selected=-1,toastTimer=0,last=0,territoryLayer=document.createElement('canvas'),tc=territoryLayer.getContext('2d');
const nations=[{name:'AURELIA',color:'#d75d58',dark:'#823b3b',capital:{x:930,y:900},seed:11},{name:'VESTMARK',color:'#5599dc',dark:'#2e5b88',capital:{x:2180,y:820},seed:23},{name:'SOLMERE',color:'#55ad83',dark:'#2c7657',capital:{x:1020,y:1600},seed:37},{name:'KARTH',color:'#d8b94e',dark:'#8e722d',capital:{x:2240,y:1540},seed:49}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';c.setTransform(dpr,0,0,dpr,0,0);cam.z=clamp(cam.z,.28,1.5);draw()}
function noise(x,y,s){return Math.sin(x*.013+s)*Math.cos(y*.017+s*1.7)+.45*Math.sin((x+y)*.009+s*2)}
function landAt(x,y){const continents=[{x:1570,y:1060,rx:1350,ry:760},{x:560,y:470,rx:430,ry:290},{x:2730,y:430,rx:350,ry:270},{x:2670,y:1850,rx:430,ry:250},{x:420,y:1850,rx:330,ry:190}];return continents.some((p,i)=>{const n=noise(x,y,i*3);const dx=(x-p.x)/(p.rx*(1+n*.07)),dy=(y-p.y)/(p.ry*(1+n*.07));return dx*dx+dy*dy<1})}
function makeTerrain(){territoryLayer.width=MW;territoryLayer.height=MH;tc.clearRect(0,0,MW,MH);const step=12;for(let y=0;y<MH;y+=step)for(let x=0;x<MW;x+=step){if(!landAt(x,y))continue;const n=noise(x,y,8);tc.fillStyle=n>.55?'#8b9a70':n<-.55?'#b5aa7c':'#9eaa7d';tc.fillRect(x,y,step+1,step+1)}}
function makeTerritory(t){const circles=[{x:t.capital.x,y:t.capital.y,r:235}];return circles}
function teamTerritoryPath(t){const points=[];const n=160;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let radius=220+Math.sin(a*3+t.seed)*26+Math.sin(a*7+t.seed*2)*13+Math.cos(a*11+t.seed)*8;for(const p of t.outposts){const dx=Math.cos(a),dy=Math.sin(a),px=p.x-t.capital.x,py=p.y-t.capital.y,along=px*dx+py*dy,side=Math.abs(px*dy-py*dx);if(along>0&&side<75)radius=Math.max(radius,along+75)}points.push({x:t.capital.x+Math.cos(a)*radius,y:t.capital.y+Math.sin(a)*radius})}return points}
function path(points){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath()}
function init(){teams.length=0;nations.forEach(n=>teams.push({...n,outposts:[],pendingSettlements:[],ball:{x:n.capital.x,y:n.capital.y,angle:0,target:null,wait:0},territory:[],population:30,army:0,civilians:[],buildings:[],resources:{wood:0,stone:0,food:0},nodes:[],buildTimer:0,buildingSerial:0,settlements:[]}));for(const t of teams){t.territory=teamTerritoryPath(t);const golden=Math.PI*(3-Math.sqrt(5));for(let i=0;i<64;i++){const a=i*golden+t.seed,r=115+Math.sqrt(i/64)*205,x=t.capital.x+Math.cos(a)*r,y=t.capital.y+Math.sin(a)*r;if(landAt(x,y)&&inside(t,x,y))t.nodes.push({id:i,type:i%4===0?'stone':'wood',x,y,amount:100+Math.floor(rand(40,100)),max:200,reservedBy:null,reservedUntil:0})}for(let i=0;i<30;i++){let x=t.capital.x,y=t.capital.y;for(let k=0;k<100;k++){const a=rand(0,Math.PI*2),r=Math.sqrt(rand(0,1))*205,px=t.capital.x+Math.cos(a)*r,py=t.capital.y+Math.sin(a)*r;if(landAt(px,py)&&inside(t,px,py)){x=px;y=py;break}}const personality=personalityFor();t.civilians.push({id:i,x,y,tx:x+rand(-25,25),ty:y+rand(-25,25),speed:22+rand(0,15),speedFactor:rand(.86,1.14),efficiency:rand(.72,1.32),personality,preferredResource:Math.random()<.5?'wood':'stone',gender:Math.random()<.5?'female':'male',breakChance:personality==='lazy'?.8:personality==='hardworker'?.12:.35,role:'civilian',task:'wander',homeId:null,familyId:null,age:rand(18,55),stage:'adult',inventory:{wood:0,stone:0,food:0},needs:{rest:rand(.3,1),social:rand(.2,1)},decision:rand(2,35),targetNode:null,carrying:false,carryingBaby:null,workPhase:rand(0,2),flag:false,settlementHome:null})}t.buildings.push({id:t.buildingSerial++,type:'capital',x:t.capital.x,y:t.capital.y,progress:1,workers:[],radius:33,residents:[]})}makeTerrain();cam={x:MW/2,y:MH/2,z:.62};year=1;sim=0;selected=-1;selection.classList.remove('show');notify('New societies begin with empty stores and no farms.')}function notify(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2100)}
function inside(t,x,y){const pts=t.territory;let hit=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))hit=!hit}return hit}
function chooseFrontier(t){let best=null,bscore=-1e9;const origins=[{x:t.capital.x,y:t.capital.y},...t.settlements];for(let k=0;k<240;k++){const origin=origins[Math.floor(rand(0,origins.length))],a=rand(0,Math.PI*2),r=rand(250,410),p={x:origin.x+Math.cos(a)*r,y:origin.y+Math.sin(a)*r};if(!landAt(p.x,p.y)||inside(t,p.x,p.y))continue;if(t.pendingSettlements?.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<190))continue;let blocked=false;for(let j=0;j<=18;j++){const f=j/18,x=origin.x+(p.x-origin.x)*f,y=origin.y+(p.y-origin.y)*f;if(!landAt(x,y)){blocked=true;break}for(const other of teams)if(other!==t&&inside(other,x,y)){blocked=true;break}if(blocked)break}if(blocked)continue;const score=rand(0,1)*2-Math.hypot(p.x-origin.x,p.y-origin.y)*.001;if(score>bscore){bscore=score;best=p}}return best}
function civilianTarget(t,x0,y0){for(let k=0;k<45;k++){const a=rand(0,Math.PI*2),r=rand(18,115),x=x0+Math.cos(a)*r,y=y0+Math.sin(a)*r;if(!landAt(x,y)||!inside(t,x,y)||teams.some(o=>o!==t&&inside(o,x,y)))continue;return{x,y}}return{x:x0+rand(-20,20),y:y0+rand(-20,20)}}
function nearestNode(t,v,type){let best=null,bd=Infinity;for(const n of t.nodes){if(n.amount<=1||(type&&n.type!==type))continue;if(n.reservedBy!==null&&n.reservedBy!==undefined&&n.reservedBy!==v.id)continue;const d=Math.hypot(n.x-v.x,n.y-v.y)+rand(0,24);if(d<bd){bd=d;best=n}}return best}
function nearestHouse(t,v){let best=null,bd=Infinity;for(const b of t.buildings)if(b.type==='house'&&b.progress>=1&&b.residents.length<6){if(v.settlementHome&&b.settlement!==v.settlementHome&&Math.hypot(b.x-v.settlementHome.x,b.y-v.settlementHome.y)>180)continue;const d=Math.hypot(b.x-v.x,b.y-v.y);if(d<bd){bd=d;best=b}}return best}
function createBuilding(t,type){const costs={farm:{wood:22,stone:10},house:{wood:18,stone:12},factory:{wood:55,stone:45}};const cost=costs[type];if(!cost||t.resources.wood<cost.wood||t.resources.stone<cost.stone)return false;let origin=t.capital;if(t.settlements.length){const st=[...t.settlements].sort((a,b)=>a.residents.length-b.residents.length)[0];if(st.residents.length>=3)origin=st}let p=null;for(let k=0;k<140;k++){const q=civilianTarget(t,origin.x+rand(-170,170),origin.y+rand(-170,170));if(t.buildings.every(b=>Math.hypot(b.x-q.x,b.y-q.y)>65)&&landAt(q.x,q.y)){p=q;break}}if(!p)return false;t.resources.wood-=cost.wood;t.resources.stone-=cost.stone;const b={id:t.buildingSerial++,type,x:p.x,y:p.y,progress:0,workers:[],radius:type==='farm'?28:type==='factory'?19:13,residents:[],crops:[],food:0,workTimer:0,settlement:origin===t.capital?null:origin};if(type==='farm')for(let i=0;i<18;i++)b.crops.push({x:p.x+rand(-20,20),y:p.y+rand(-14,14),ready:rand(0,1),reservedBy:null});t.buildings.push(b);const count=type==='farm'?15:8;const workers=t.civilians.filter(v=>v.stage==='adult'&&(v.role==='gatherer'||v.role==='civilian')&&(v.task==='wander'||v.task==='gather')&&v.personality!=='lazy').sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y)).slice(0,count);for(const v of workers){releaseNode(v);v.role='builder';v.task='build';v.taskSince=sim;v.targetBuilding=b.id;v.tx=p.x+rand(-35,35);v.ty=p.y+rand(-25,25);b.workers.push(v.id)}return true}
function startExpansion(t){if(t.resources.wood<30||t.resources.stone<16)return false;const candidates=t.civilians.filter(v=>v.stage==='adult'&&!v.flag&&(v.task==='wander'||(v.task==='gather'&&v.inventory.wood+v.inventory.stone===0))&&v.personality!=='lazy').sort((a,b)=>{const pref=v=>v.personality==='explorer'?0:v.personality==='hardworker'?1:2;return pref(a)-pref(b)||rand(-.2,.2)});const settler=candidates[0];if(!settler)return false;const p=chooseFrontier(t);if(!p)return false;t.pendingSettlements=t.pendingSettlements||[];t.pendingSettlements.push(p);t.resources.wood-=30;t.resources.stone-=16;releaseNode(settler);settler.task='expand';settler.role='settler';settler.flag=true;settler.settlementTarget=p;settler.tx=p.x;settler.ty=p.y;settler.decision=rand(40,80);settler.taskSince=sim;return true}
function plantSettlementFlag(t,v){const p=v.settlementTarget;if(!p||!landAt(p.x,p.y)||teams.some(o=>o!==t&&inside(o,p.x,p.y)))return false;const old=t.territory;t.outposts.push({x:p.x,y:p.y});const candidate=teamTerritoryPath(t);let valid=true;for(let i=0;i<candidate.length;i++){const q=candidate[i];if(teams.some(o=>o!==t&&inside(o,q.x,q.y))){valid=false;break}}if(!valid){t.outposts.pop();t.territory=old;return false}t.territory=candidate;const st={x:p.x,y:p.y,owner:t.name,residents:[v.id],resources:{wood:0,stone:0,food:0},created:sim};t.settlements.push(st);for(let ni=0;ni<8;ni++){const a=ni*Math.PI/4+rand(-.2,.2),r=rand(65,145),x=p.x+Math.cos(a)*r,y=p.y+Math.sin(a)*r;if(landAt(x,y)&&inside(t,x,y))t.nodes.push({id:t.nodes.length,type:ni%3===0?'stone':'wood',x,y,amount:rand(90,170),max:200,reservedBy:null,reservedUntil:0})}t.pendingSettlements=(t.pendingSettlements||[]).filter(q=>q!==p);v.flag=false;v.role='civilian';v.task='wander';v.settlementTarget=null;v.settlementHome=st;v.tx=p.x+rand(-40,40);v.ty=p.y+rand(-40,40);notify(t.name+' established a new flag settlement.');return true}
function assignHome(t,v){if(v.homeId!==null)return;const h=nearestHouse(t,v);if(h&&h.residents.length<6){h.residents.push(v.id);v.homeId=h.id;v.homeX=h.x;v.homeY=h.y}}
function releaseNode(v){if(v.targetNode&&v.targetNode.reservedBy===v.id){v.targetNode.reservedBy=null;v.targetNode.reservedUntil=0}v.targetNode=null}
function moveCivilian(t,v,dt,buckets){
 if(v.stage==='baby'&&v.carriedBy!==null){const mother=t.civilians.find(q=>q.id===v.carriedBy);if(mother){v.x=mother.x+5;v.y=mother.y+3}return}
 if(v.stage!=='adult'&&v.stage!=='toddler'){const h=t.buildings.find(b=>b.id===v.homeId);if(h){v.x+=(h.x-v.x)*Math.min(1,dt*2);v.y+=(h.y-v.y)*Math.min(1,dt*2)}return}
 if(v.stage==='toddler'){v.tx=v.homeX||v.x;v.ty=v.homeY||v.y}
 if(v.task==='gather'){
  if(!v.targetNode||v.targetNode.amount<1||v.targetNode.reservedBy!==v.id){releaseNode(v);v.targetNode=nearestNode(t,v,v.preferredResource);if(v.targetNode){v.targetNode.reservedBy=v.id;v.targetNode.reservedUntil=sim+90;v.tx=v.targetNode.x+rand(-6,6);v.ty=v.targetNode.y+rand(-6,6)}else{v.task='wander';v.decision=rand(4,12)}}
  if(v.targetNode&&Math.hypot(v.x-v.targetNode.x,v.y-v.targetNode.y)<13){const n=v.targetNode,kind=n.type,amount=Math.min(dt*(.65+v.efficiency*.75),n.amount,10-v.inventory[kind]);n.amount-=amount;v.inventory[kind]+=amount;n.reservedUntil=sim+45;if(v.inventory.wood+v.inventory.stone>=7){releaseNode(v);v.task='deliver';v.role='carrier';const home=v.settlementHome||null;v.tx=(home?.x??t.capital.x)+rand(-25,25);v.ty=(home?.y??t.capital.y)+rand(-25,25)}}
 }else if(v.task==='expand'){const p=v.settlementTarget;if(p&&Math.hypot(v.x-p.x,v.y-p.y)<16){if(!plantSettlementFlag(t,v)){t.pendingSettlements=(t.pendingSettlements||[]).filter(q=>q!==p);v.flag=false;v.role='civilian';v.task='wander';v.settlementTarget=null;v.decision=rand(5,15)}}}
 else if(v.task==='deliver'){const home=v.settlementHome;const hx=home?.x??t.capital.x,hy=home?.y??t.capital.y;if(Math.hypot(v.x-hx,v.y-hy)<48){const store=home?.resources||t.resources;store.wood+=v.inventory.wood;store.stone+=v.inventory.stone;store.food+=v.inventory.food;v.inventory.wood=0;v.inventory.stone=0;v.inventory.food=0;v.task='wander';v.role='civilian';v.decision=rand(3,13)}}
 else if(v.task==='build'||v.task==='farm'){const b=t.buildings.find(q=>q.id===v.targetBuilding);if(!b){v.task='wander';v.role='civilian';v.targetBuilding=null}else if(v.task==='build'){if(b.progress>=1){v.task=b.type==='farm'?'farm':'wander';v.role=b.type==='farm'?'farmer':'civilian';v.workPhase=0;v.decision=rand(8,24)}else{const slot=b.workers.indexOf(v.id),a=(slot/Math.max(1,b.workers.length))*Math.PI*2;v.tx=b.x+Math.cos(a)*(b.radius+12);v.ty=b.y+Math.sin(a)*(b.radius+12);if(Math.hypot(v.x-b.x,v.y-b.y)<b.radius+18)b.progress=Math.min(1,b.progress+dt*.0018*v.efficiency)}}else{const slot=b.workers.indexOf(v.id),crop=v.farmCrop||b.crops.find(q=>!q.reservedBy);if(v.inventory.food>=5){if(crop&&crop.reservedBy===v.id)crop.reservedBy=null;v.farmCrop=null;v.task='deliver';v.role='carrier';const home=v.settlementHome;v.tx=(home?.x??t.capital.x)+rand(-32,32);v.ty=(home?.y??t.capital.y)+rand(-32,32)}else if(crop){v.farmCrop=crop;crop.reservedBy=v.id;crop.reservedUntil=sim+90;v.tx=crop.x;v.ty=crop.y;if(Math.hypot(v.x-crop.x,v.y-crop.y)<7){crop.ready=Math.max(0,crop.ready-dt*.15*v.efficiency);if(crop.ready===0){v.inventory.food++;crop.ready=1;v.workPhase+=1}}}}}
 else{thinkCivilian(t,v,dt)}
 const dx=v.tx-v.x,dy=v.ty-v.y,d=Math.hypot(dx,dy)||1,step=Math.min(d,v.speed*v.speedFactor*dt);let nx=v.x+dx/d*step,ny=v.y+dy/d*step;let sx=0,sy=0;const gx=Math.floor(v.x/18),gy=Math.floor(v.y/18);for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const near=buckets.get((gx+ox)+','+(gy+oy))||[];for(const q of near){if(q===v||q.stage==='baby')continue;const ax=nx-q.x,ay=ny-q.y,dd=Math.hypot(ax,ay);if(dd<9&&dd>.001){const push=(9-dd)/9;sx+=ax/dd*push;sy+=ay/dd*push}}}nx+=sx*step*.9;ny+=sy*step*.9;
 const settler=v.task==='expand';if(!landAt(nx,ny)||(!settler&&!inside(t,nx,ny))||teams.some(o=>o!==t&&inside(o,nx,ny))){if(settler){v.tx=v.x+rand(-8,8);v.ty=v.y+rand(-8,8)}else{const p=civilianTarget(t,v.x,v.y);v.tx=p.x;v.ty=p.y}return}
 let blocked=false;for(const b of t.buildings)if(Math.hypot(nx-b.x,ny-b.y)<b.radius+6&&!(b.type==='farm'&&v.targetBuilding===b.id&&v.task==='farm')){blocked=true;break}if(blocked){const side=rand(-1,1);v.tx=v.x-dy/d*side*35;v.ty=v.y+dx/d*side*35;return}v.x=nx;v.y=ny;

function frame(now){const realDt=Math.min((now-last)/1000||0,.05);last=now;if(!paused){simAccumulator+=realDt*simulationSpeed;let steps=0;while(simAccumulator>=1/60&&steps<36){update(1/60);simAccumulator-=1/60;steps++}}draw();clock.textContent='YEAR '+year+' · '+teams.reduce((n,t)=>n+t.civilians.length,0).toLocaleString()+' CIVILIANS';requestAnimationFrame(frame)}
function inspect(i){selected=i;const t=teams[i];selection.innerHTML='<strong style="color:'+t.color+'">'+t.name+'</strong><small>'+t.civilians.length+' citizens · '+t.buildings.filter(b=>b.type==='house').length+' houses · '+t.nodes.length+' resource sites</small>';selection.classList.add('show');draw()}function inspectCity(t,city){selection.innerHTML='<strong style="color:'+t.color+'">'+city.name+'</strong><small>'+city.population+' residents · '+city.houses+' houses · '+city.farms+' farms · '+city.factories+' factories<br>'+city.employment+'% employed · '+city.food.toFixed(1)+' food · '+Math.round(city.morale*100)+' morale</small>';selection.classList.add('show')}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};cv.setPointerCapture(e.pointerId);cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;cam.x=clamp(drag.cx-dx/cam.z,0,MW);cam.y=clamp(drag.cy-dy/cam.z,0,MH)});
cv.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){const p=worldPoint(e.clientX,e.clientY);let cityHit=null,cityDist=Infinity;for(const t of teams)for(const city of (t.cities||[])){const d=Math.hypot(p.x-city.x,p.y-city.y);if(d<27/cam.z&&d<cityDist){cityHit={t,city};cityDist=d}}let hit=-1,bd=Infinity;teams.forEach((t,i)=>{const d=Math.hypot(p.x-t.ball.x,p.y-t.ball.y);if(d<42/cam.z&&d<bd){hit=i;bd=d}});if(cityHit&&cityDist<bd)inspectCity(cityHit.t,cityHit.city);else if(hit>=0)inspect(hit);else{selected=-1;selection.classList.remove('show')}}drag=null;cv.classList.remove('drag')});
cv.addEventListener('wheel',e=>{e.preventDefault();const before=worldPoint(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.exp(-e.deltaY*.001),.22,1.8);const after=worldPoint(e.clientX,e.clientY);cam.x+=before.x-after.x;cam.y+=before.y-after.y},{passive:false});
document.getElementById('gear').onclick=()=>{panel.classList.toggle('open');stats.innerHTML=teams.map(t=>'<div class="row"><span style="color:'+t.color+'">'+t.name+'</span><span>'+t.civilians.length+' people · '+t.resources.wood+'W / '+t.resources.stone+'S</span></div>').join('')};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume simulation':'Pause simulation'};document.querySelectorAll('#speedbar button').forEach(b=>b.onclick=()=>{simulationSpeed=Number(b.dataset.speed);document.querySelectorAll('#speedbar button').forEach(q=>q.classList.toggle('active',q===b))});
document.getElementById('reset').onclick=init;addEventListener('resize',resize);init();resize();requestAnimationFrame(frame);
})();
</script></body></html>
