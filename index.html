(()=>{'use strict';
const cv=document.getElementById('world'),c=cv.getContext('2d'),clock=document.getElementById('clock'),panel=document.getElementById('panel'),stats=document.getElementById('stats'),selection=document.getElementById('selection'),toast=document.getElementById('toast');let selectedCityRef=null;

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';c.setTransform(dpr,0,0,dpr,0,0);cam.z=clamp(cam.z,.28,1.5);draw()}
function noise(x,y,s){return Math.sin(x*.013+s)*Math.cos(y*.017+s*1.7)+.45*Math.sin((x+y)*.009+s*2)}
function landAt(x,y){const continents=[{x:1570,y:1060,rx:1350,ry:760},{x:560,y:470,rx:430,ry:290},{x:2730,y:430,rx:350,ry:270},{x:2670,y:1850,rx:430,ry:250},{x:420,y:1850,rx:330,ry:190}];return continents.some((p,i)=>{const n=noise(x,y,i*3);const dx=(x-p.x)/(p.rx*(1+n*.07)),dy=(y-p.y)/(p.ry*(1+n*.07));return dx*dx+dy*dy<1})}
function makeTerrain(){territoryLayer.width=MW;territoryLayer.height=MH;tc.clearRect(0,0,MW,MH);const step=12;for(let y=0;y<MH;y+=step)for(let x=0;x<MW;x+=step){if(!landAt(x,y))continue;const n=noise(x,y,8);tc.fillStyle=n>.55?'#8b9a70':n<-.55?'#b5aa7c':'#9eaa7d';tc.fillRect(x,y,step+1,step+1)}}
function makeTerritory(t){const circles=[{x:t.capital.x,y:t.capital.y,r:235}];return circles}
function teamTerritoryPath(t){const points=[];const n=160;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let radius=220+Math.sin(a*3+t.seed)*26+Math.sin(a*7+t.seed*2)*13+Math.cos(a*11+t.seed)*8;for(const p of t.outposts){const dx=Math.cos(a),dy=Math.sin(a),px=p.x-t.capital.x,py=p.y-t.capital.y,along=px*dx+py*dy,side=Math.abs(px*dy-py*dx);if(along>0&&side<75)radius=Math.max(radius,along+75)}points.push({x:t.capital.x+Math.cos(a)*radius,y:t.capital.y+Math.sin(a)*radius})}return points}
function path(points){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath()}
function init(){teams.length=0;nations.forEach(n=>teams.push({...n,outposts:[],pendingSettlements:[],ball:{x:n.capital.x,y:n.capital.y,angle:0,target:null,wait:0},territory:[],population:30,army:0,military:{lastRecruit:0,casualties:0,morale:75},diplomacy:{relations:{},alliances:[],wars:[],lastReview:0},civilians:[],horses:[],government:{leader:'President',alerts:[]},buildings:[],resources:{wood:0,stone:0,food:0},nodes:[],buildTimer:0,buildingSerial:0,settlements:[]}));for(const t of teams){t.diplomacy.relations=Object.fromEntries(teams.filter(o=>o!==t).map(o=>[o.name,0]));t.territory=teamTerritoryPath(t);const golden=Math.PI*(3-Math.sqrt(5));for(let i=0;i<88;i++){const a=i*golden+t.seed,r=85+Math.sqrt(i/88)*130,x=t.capital.x+Math.cos(a)*r,y=t.capital.y+Math.sin(a)*r;if(landAt(x,y)&&inside(t,x,y)&&Math.hypot(x-t.capital.x,y-t.capital.y)>78)t.nodes.push({id:i,type:i%3===0?'stone':'wood',x,y,amount:100+Math.floor(rand(40,100)),max:200,reservedBy:null,reservedUntil:0})}for(let i=0;i<30;i++){let x=t.capital.x,y=t.capital.y;for(let k=0;k<100;k++){const a=rand(0,Math.PI*2),r=Math.sqrt(rand(0,1))*205,px=t.capital.x+Math.cos(a)*r,py=t.capital.y+Math.sin(a)*r;if(landAt(px,py)&&inside(t,px,py)){x=px;y=py;break}}const personality=personalityFor();t.civilians.push({id:i,x,y,tx:x+rand(-25,25),ty:y+rand(-25,25),speed:22+rand(0,15),speedFactor:rand(.86,1.14),efficiency:rand(.72,1.32),personality,preferredResource:Math.random()<.5?'wood':'stone',gender:Math.random()<.5?'female':'male',breakChance:personality==='lazy'?.8:personality==='hardworker'?.12:.35,role:'civilian',task:'wander',homeId:null,familyId:null,age:rand(18,55),stage:'adult',inventory:{wood:0,stone:0,food:0},needs:{rest:rand(.3,1),social:rand(.2,1)},decision:rand(2,35),targetNode:null,carrying:false,carryingBaby:null,workPhase:rand(0,2),flag:false,settlementHome:null})}t.buildings.push({id:t.buildingSerial++,type:'capital',x:t.capital.x,y:t.capital.y,progress:1,workers:[],radius:33,residents:[]})}makeTerrain();cam={x:M function inside(t,x,y){if(t.rebelZones?.some(z=>Math.hypot(x-z.x,y-z.y)<z.r))return false;const pts=t.territory;let hit=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if(((a.y>y)!==(b.y>y))&&(x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x))hit=!hit}return hit}
function placementClear(t,x,y,r=20){if(!landAt(x,y)||!inside(t,x,y)||teams.some(o=>o!==t&&inside(o,x,y)))return false;for(const b of t.buildings)if(Math.hypot(b.x-x,b.y-y)<r+b.radius+12)return false;for(const n of t.nodes)if((n.type==='wood'||n.amount>0)&&Math.hypot(n.x-x,n.y-y)<r+(n.type==='wood'?19:13))return false;for(const st of t.settlements||[])if(Math.hypot(st.x-x,st.y-y)<r+12)return false;return true}

function civilianTarget(t,x0,y0){for(let k=0;k<45;k++){const a=rand(0,Math.PI*2),r=rand(18,115),x=x0+Math.cos(a)*r,y=y0+Math.sin(a)*r;if(!landAt(x,y)||!inside(t,x,y)||teams.some(o=>o!==t&&inside(o,x,y)))continue;return{x,y}}return{x:x0+rand(-20,20),y:y0+rand(-20,20)}}

function storageTarget(t,v,home,capital){const target=home||capital,offset=home?18:54,base=Math.atan2(v.y-target.y,v.x-target.x);let best=null,bd=Infinity;for(let i=0;i<24;i++){const a=base+i*Math.PI*2/24,x=target.x+Math.cos(a)*offset,y=target.y+Math.sin(a)*offset;if(!landAt(x,y)||!inside(t,x,y)||teams.some(o=>o!==t&&inside(o,x,y)))continue;const d=Math.hypot(v.x-x,v.y-y);if(d<bd){bd=d;best={x,y}}}if(best){v.tx=best.x;v.ty=best.y;v.finalTx=best.x;v.finalTy=best.y;v.taskReason='Moving to safe storage approach'}else{v.tx=target.x;v.ty=target.y;v.finalTx=target.x;v.finalTy=target.y;v.taskReason='Finding a safe storage approach'}}

function createBuilding(t,type,preferredOrigin=null){const costs={farm:{wood:22,stone:10},house:{wood:18,stone:12},factory:{wood:55,stone:45}},localCosts={farm:{wood:12,stone:6},house:{wood:8,stone:6},factory:{wood:25,stone:16}};if(!costs[type])return false;let origin=preferredOrigin||t.capital;const candidates=t.settlements.filter(st=>st.residents.length>=2&&st.resources.wood>=localCosts[type].wood&&st.resources.stone>=localCosts[type].stone).sort((a,b)=>b.residents.length-a.residents.length);if(!preferredOrigin&&candidates.length)origin=candidates[0];const cost=origin===t.capital?costs[type]:localCosts[type];const store=origin===t.capital?t.resources:origin.resources;if(store.wood<cost.wood||store.stone<cost.stone)return false;let p=null;for(let k=0;k<180;k++){const q=civilianTarget(t,origin.x+rand(-170,170),origin.y+rand(-170,170));if(placementClear(t,q.x,q.y,type==='farm'?34:type==='house'?24:29)){p=q;break}}if(!p)return false;const b={id:t.buildingSerial++,type,x:p.x,y:p.y,progress:0,workers:[],radius:type==='farm'?28:type==='factory'?19:13,residents:[],crops:[],food:0,workTimer:0,settlement:origin===t.capital?null:origin,materialsRequired:{wood:cost.wood,stone:cost.stone},materialsDelivered:{wood:0,stone:0},materialsReady:false,deliveryStore:store};t.buildings.push(b);if(origin!==t.capital){origin.roads=origin.roads||[];origin.roads.push({buildingId:b.id,x1:origin.x,y1:origin.y,x2:p.x,y2:p.y,progress:0})}if(type==='farm')for(let i=0;i<18;i++)b.crops.push({x:p.x+rand(-20,20),y:p.y+rand(-14,14),ready:rand(0,1),reservedBy:null,reservedUntil:0});store.wood-=cost.wood;store.stone-=cost.stone;const eligible=t.civilians.filter(v=>v.stage==='adult'&&v.personality!=='lazy'&&(v.task==='wander'||v.task==='idle'||v.task==='gather')&&v.inventory.wood+v.inventory.stone+v.inventory.food<.01&&(origin===t.capital?!v.settlementHome:v.settlementHome===origin)).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));const carrierCount=eligible.length?1:0;for(let i=0;i<carrierCount;i++){const v=eligible[i];releaseWork(t,v);const wood=i===0?Math.ceil(cost.wood/carrierCount):cost.wood-Math.ceil(cost.wood/carrierCount);const stone=i===0?Math.ceil(cost.stone/carrierCount):cost.stone-Math.ceil(cost.stone/carrierCount);v.inventory.wood=wood;v.inventory.stone=stone;v.task='deliver_building';v.role='carrier';v.targetBuilding=b.id;v.taskSince=sim;v.tx=p.x+rand(-8,8);v.ty=p.y+rand(-8,8);v.taskReason='Delivering construction materials';}if(carrierCount===0){store.wood+=cost.wood;store.stone+=cost.stone;t.buildings.pop();if(origin!==t.capital)origin.roads=origin.roads.filter(r=>r.buildingId!==b.id);return false}const builderCount=Math.min(type==='farm'?4:3,eligible.length-carrierCount);for(let i=carrierCount;i<carrierCount+builderCount;i++){const v=eligible[i];releaseWork(t,v);v.role='builder';v.task='build';v.taskSince=sim;v.targetBuilding=b.id;v.tx=p.x+rand(-35,35);v.ty=p.y+rand(-25,25);b.workers.push(v.id)}return true}
function startExpansion(t){t.pendingSettlements=t.pendingSettlements||[];if(t.pendingSettlements.length>=1)return false;const expansionCost={wood:12,stone:6};const sources=[{home:null,x:t.capital.x,y:t.capital.y,resources:t.resources},...(t.settlements||[]).map(st=>({home:st,x:st.x,y:st.y,resources:st.resources}))].filter(src=>src.resources.wood>=expansionCost.wood&&src.resources.stone>=expansionCost.stone).sort((a,b)=>(b.resources.wood+b.resources.stone)-(a.resources.wood+a.resources.stone));const source=sources[0];if(!source)return false;const candidates=t.civilians.filter(v=>v.stage==='adult'&&!v.flag&&(v.task==='wander'||v.task==='idle'||v.task==='gather')&&v.personality!=='lazy'&&(!source.home?!v.settlementHome:v.settlementHome===source.home)).sort((a,b)=>{const pref=v=>v.personality==='explorer'?0:v.personality==='hardworker'?1:2;return pref(a)-pref(b)||Math.hypot(a.x-source.x,a.y-source.y)-Math.hypot(b.x-source.x,b.y-source.y)});const settler=candidates[0];if(!settler)return false;if(settler.inventory){source.resources.wood+=settler.inventory.wood||0;source.resources.stone+=settler.inventory.stone||0;source.resources.food+=settler.inventory.food||0;settler.inventory.wood=0;settler.inventory.stone=0;settler.inventory.food=0}const p=chooseFrontier(t,source.home||{x:source.x,y:source.y});if(!p)return false;source.resources.wood-=expansionCost.wood;source.resources.stone-=expansionCost.stone;const starterWood=5,starterStone=3,starterFood=Math.min(8,source.resources.food||0);source.resources.food-=starterFood;settler.settlementSupplies={wood:starterWood,stone:starterStone,food:starterFood};t.pendingSettlements.push(p);releaseNode(settler);settler.task='expand';settler.role='settler';settler.flag=true;settler.settlementTarget=p;settler.tx=p.x;settler.ty=p.y;settler.finalTx=p.x;settler.finalTy=p.y;settler.decision=rand(40,80);settler.taskSince=sim;settler.taskReason='Travelling to establish a settlement';return true}
function plantSettlementFlag(t,v){const p=v.settlementTarget;if(!p||!landAt(p.x,p.y)||teams.some(o=>o!==t&&inside(o,p.x,p.y)))return false;const old=t.territory;t.outposts.push({x:p.x,y:p.y});const candidate=teamTerritoryPath(t);let valid=true;for(let i=0;i<candidate.length;i++){const q=candidate[i];if(teams.some(o=>o!==t&&inside(o,q.x,q.y))){valid=false;break}}if(!valid){t.outposts.pop();t.territory=old;return false}t.territory=candidate;const st={id:t.name+'-settlement-'+(t.settlements.length+1),x:p.x,y:p.y,name:t.name+' '+(t.settlements.length+1),owner:t.name,residents:[v.id],resources:{wood:v.settlementSupplies?.wood||0,stone:v.settlementSupplies?.stone||0,food:v.settlementSupplies?.food||0},created:sim,territory:Array.from({length:48},(_,i)=>({x:p.x+Math.cos(i/48*Math.PI*2)*175,y:p.y+Math.sin(i/48*Math.PI*2)*175})),roads:[],city:null,unhappyYears:0,lastReview:sim,requestClock:0};t.settlements.push(st);for(let ni=0;ni<12;ni++){const a=ni*Math.PI/6+rand(-.2,.2),r=rand(65,145),x=p.x+Math.cos(a)*r,y=p.y+Math.sin(a)*r;if(placementClear(t,x,y,18))t.nodes.push({id:t.nodes.length,type:ni%3===0?'stone':'wood',x,y,amount:rand(90,170),max:200,reservedBy:null,reservedUntil:0})}t.pendingSettlements=(t.pendingSettlements||[]).filter(q=>q!==p);v.flag=false;v.role='civilian';v.task='wander';v.settlementTarget=null;v.settlementSupplies=null;v.settlementHome=st;v.tx=p.x+rand(-40,40);v.ty=p.y+rand(-40,40);notify(t.name+' established a new flag settlement.');return true}
function assignHome(t,v){if(v.homeId!==null)return;const h=nearestHouse(t,v);if(h&&h.residents.length<6){h.residents.push(v.id);v.homeId=h.id;v.homeX=h.x;v.homeY=h.y}}
function releaseNode(v){if(v.targetNode&&v.targetNode.reservedBy===v.id){v.targetNode.reservedBy=null;v.targetNode.reservedUntil=0}v.targetNode=null}
function moveCivilian(t,v,dt,buckets){

function draw(){c.clearRect(0,0,W,H);c.fillStyle='#183746';c.fillRect(0,0,W,H);c.save();c.translate(W/2-cam.x*cam.z,H/2-cam.y*cam.z);c.scale(cam.z,cam.z);c.drawImage(territoryLayer,0,0);c.strokeStyle='#274a4b';c.lineWidth=3;for(let i=0;i<110;i++){const x=(i*317)%MW,y=(i*719)%MH;if(landAt(x,y)){const n=noise(x,y,19);c.beginPath();c.ellipse(x,y,5+n*3,3+n*2,i*.31,0,7);c.stroke()}}for(const t of teams){path(t.territory);c.fillStyle=t.color+'35';c.fill();c.lineWidth=5;c.strokeStyle=t.color;c.stroke();c.lineWidth=1.5;c.strokeStyle='#f4edcf';c.setLineDash([7,8]);c.stroke();c.setLineDash([]);for(const p of t.outposts){c.fillStyle=t.dark;c.beginPath();c.arc(p.x,p.y,7,0,7);c.fill();c.strokeStyle='#e8e4d1';c.lineWidth=2;c.stroke()}drawCapital(t);for(const st of t.settlements){if(st.territory){path(st.territory);c.fillStyle=t.color+'0b';c.fill();c.strokeStyle=t.color+'55';c.lineWidth=1.5;c.stroke()}for(const road of (st.roads||[])){if(road.progress>.03){c.beginPath();c.moveTo(road.x1,road.y1);c.lineTo(road.x2,road.y2);c.strokeStyle='#b6a47d';c.globalAlpha=.25+.6*road.progress;c.lineWidth=1.5+2*road.progress;c.stroke();c.globalAlpha=1}}if(st.city&&st.city.anchorSettlement===st){drawMoodBall(st.city.x,st.city.y,t,st.city.morale);c.fillStyle='#f4f0dc';c.font='bold 10px Arial';c.textAlign='center';c.fillText(st.city.name,st.city.x,st.city.y-24)}}for(const st of t.settlements){c.strokeStyle='#e8e6d7';c.lineWidth=2;c.beginPath();c.moveTo(st.x,st.y+8);c.lineTo(st.x,st.y-13);c.stroke();c.fillStyle=t.color;c.beginPath();c.moveTo(st.x,st.y-13);c.lineTo(st.x+12,st.y-9);c.lineTo(st.x,st.y-5);c.fill()}for(const v of t.civilians){if(v.flag){c.strokeStyle='#eee8d5';c.lineWidth=1.5;c.beginPath();c.moveTo(v.x,v.y+3);c.lineTo(v.x,v.y-12);c.stroke();c.fillStyle=t.color;c.beginPath();c.moveTo(v.x,v.y-12);c.lineTo(v.x+9,v.y-9);c.lineTo(v.x,v.y-6);c.fill()}}for(const horse of (t.horses||[])){c.save();c.translate(horse.x,horse.y);c.fillStyle='#6b4935';c.beginPath();c.ellipse(0,0,11,5,0,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(9,-5,4,6,-.35,0,Math.PI*2);c.fill();c.fillRect(-7,3,2,7);c.fillRect(-3,3,2,7);c.fillRect(3,3,2,7);c.fillRect(7,2,2,7);c.fillStyle='#3a2b25';c.fillRect(-2,-6,7,2);c.strokeStyle='#3a2b25';c.lineWidth=1.5;c.beginPath();c.moveTo(-10,-1);c.lineTo(-14,-5);c.stroke();if(horse.cargo){c.fillStyle='#b28a4e';c.fillRect(-8,-10,13,5);c.strokeStyle='#e4d2a7';c.lineWidth=1;c.strokeRect(-8,-10,13,5)}c.restore()}for(const v of t.civilians){if(v.stage==='baby'&&v.carriedBy!==null&&v.carriedBy!==undefined)continue;if(v.x<cam.x-W/cam.z||v.x>cam.x+W/cam.z||v.y<cam.y-H/cam.z||v.y>cam.y+H/cam.z)continue;c.globalAlpha=.98;const r=clamp((v.stage==='baby'?1.5:v.stage==='toddler'?2.0:v.stage==='child'?2.3:2.7)*Math.pow(cam.z,.35),1.4,4.1)/cam.z;c.fillStyle=v.role==='president'?'#25313a':t.dark;c.beginPath();c.arc(v.x,v.y,r,0,Math.PI*2);c.fill();c.strokeStyle=t.color;c.lineWidth=1.2/cam.z;c.stroke();if(v.role==='soldier'){c.fillStyle='#36a853';c.fillRect(v.x-r*.8,v.y-r-3/cam.z,r*1.6,2.5/cam.z)}else if(v.role==='builder'||v.role==='farmer'||v.role==='gatherer'||v.role==='carrier'){c.strokeStyle=v.role==='farmer'?'#9b8b52':'#c9a35e';c.lineWidth=1.6/cam.z;c.beginPath();c.moveTo(v.x+r,v.y-r);c.lineTo(v.x+r+4/cam.z,v.y-r-4/cam.z);c.stroke()}if(v.inventory&&(v.inventory.wood+v.inventory.stone+v.inventory.food)>.05){const cargoX=v.x+r+2/cam.z,cargoY=v.y-r*.3;if(v.inventory.wood>.05){c.fillStyle='#98643a';c.fillRect(cargoX,cargoY,Math.max(3,r*1.7),Math.max(2,r*.65));c.fillStyle='#d1a16a';c.fillRect(cargoX,cargoY,Math.max(3,r*1.7),Math.max(1,r*.18))}else if(v.inventory.stone>.05){c.fillStyle='#858f90';c.beginPath();c.moveTo(cargoX,cargoY+r*.6);c.lineTo(cargoX+r*.4,cargoY-r*.25);c.lineTo(cargoX+r*1.5,cargoY-r*.2);c.lineTo(cargoX+r*1.8,cargoY+r*.7);c.closePath();c.fill();c.strokeStyle='#c2c9c4';c.lineWidth=1/cam.z;c.stroke()}else if(v.inventory.food>.05){c.fillStyle='#d7b65f';c.fillRect(cargoX,cargoY,Math.max(3,r*1.5),Math.max(2,r*.8));c.strokeStyle='#7da65a';c.lineWidth=1/cam.z;c.strokeRect(cargoX,cargoY,Math.max(3,r*1.5),Math.max(2,r*.8))}}if(debugEnabled&&v.stage==='adult'){c.fillStyle='#fff4cf';c.font='bold '+Math.max(8,10/cam.z)+'px Arial';c.textAlign='center';const target=v.targetNode?('NODE '+v.targetNode.id):v.targetBuilding!==null&&v.targetBuilding!==undefined?('BUILD '+v.targetBuilding):v.task==='expand'?'SETTLEMENT':v.task==='farm'?'CROP':'—';const inv='W'+(v.inventory?.wood||0).toFixed(0)+' S'+(v.inventory?.stone||0).toFixed(0)+' F'+(v.inventory?.food||0).toFixed(0);c.fillText(v.task.toUpperCase()+' · '+inv,v.x,v.y-13/cam.z);c.fillText(target+' · '+(v.taskReason||''),v.x,v.y-24/cam.z)}if(v.birthTimer>0){c.strokeStyle='#f2d5a5';c.lineWidth=1.5/cam.z;c.beginPath();c.arc(v.x,v.y,r+4/cam.z,0,Math.PI*2);c.stroke()}if(v.carryingBaby!==null&&v.carryingBaby!==undefined){c.strokeStyle='#e6c7a2';c.lineWidth=1.7/cam.z;c.beginPath();c.moveTo(v.x-r*.55,v.y+r*.25);c.quadraticCurveTo(v.x+r*.45,v.y+r*.9,v.x+r*1.05,v.y+r*.05);c.stroke();c.fillStyle='#f3d8b4';c.beginPath();c.arc(v.x+r*.82,v.y-r*.25,Math.max(1.6,r*.68),0,7);c.fill();c.strokeStyle='#f4eee0';c.lineWidth=1/cam.z;c.stroke()}}c.globalAlpha=1;for(const n of t.nodes){if(n.type==='wood'){c.save();c.translate(n.x,n.y);const h=n.amount/n.max;if(n.amount<=0){c.strokeStyle='#715039';c.lineWidth=4;c.beginPath();c.moveTo(-10,5);c.lineTo(15,1);c.stroke();c.strokeStyle='#4c6a3e';c.lineWidth=2;c.beginPath();c.moveTo(-5,3);c.lineTo(-10,-5);c.moveTo(5,2);c.lineTo(12,-4);c.stroke()}else{c.fillStyle='#76553b';c.fillRect(-2,-3,4,12);c.fillStyle=h>.55?'#39764a':h>.25?'#64804a':'#8a7445';c.beginPath();c.arc(0,-8,8+h*5,0,Math.PI*2);c.fill();c.beginPath();c.arc(-6,-3,5+h*3,0,Math.PI*2);c.arc(6,-4,5+h*3,0,Math.PI*2);c.fill()}c.restore()}else if(n.amount>0){const h=clamp(n.amount/n.max,.12,1);c.fillStyle='#697274';c.beginPath();c.moveTo(n.x-11*h,n.y+5*h);c.lineTo(n.x-8*h,n.y-5*h);c.lineTo(n.x-1*h,n.y-10*h);c.lineTo(n.x+8*h,n.y-7*h);c.lineTo(n.x+12*h,n.y+2*h);c.lineTo(n.x+5*h,n.y+9*h);c.closePath();c.fill();c.fillStyle='#aeb8b3';c.beginPath();c.moveTo(n.x-5*h,n.y-4*h);c.lineTo(n.x-1*h,n.y-8*h);c.lineTo(n.x+4*h,n.y-5*h);c.lineTo(n.x+1*h,n.y);c.closePath();c.fill()}}drawBall(t.ball.x,t.ball.y,t,1.05)}c.restore();if(selected>=0){const t=teams[selected];const p=screenPoint(t.capital.x,t.capital.y);c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,29,0,7);c.stroke()}}
function frame(now){const realDt=Math.min((now-last)/1000||0,.05);last=now;if(!paused){simAccumulator+=realDt*simulationSpeed;let steps=0;while(simAccumulator>=1/60&&steps<36){update(1/60);simAccumulator-=1/60;steps++}}draw();clock.textContent='YEAR '+year+' · '+teams.reduce((n,t)=>n+t.civilians.length,0).toLocaleString()+' CIVILIANS';if(panel.classList.contains('open')){debugRefresh+=realDt;if(debugRefresh>.8){debugRefresh=0;renderDebug()}}requestAnimationFrame(frame)}
function inspect(i){selected=i;selectedCityRef=null;const t=teams[i];selection.innerHTML='<strong style="color:'+t.color+'">'+t.name+'</strong><small>'+t.civilians.length+' citizens · '+t.buildings.filter(b=>b.type==='house').length+' houses · '+t.nodes.length+' resource sites · Army '+t.army+' · '+(t.diplomacy?.wars?.length?'At war':'Peace')+' · Alliances '+(t.diplomacy?.alliances?.length||0)+'</small>';selection.classList.add('show');draw()}function inspectSettlement(t,st){selectedCityRef={team:t,settlement:st};selection.innerHTML='<strong style="color:'+t.color+'">'+st.name+'</strong><small>Settlement established · '+st.residents.length+' registered residents<br>Food '+st.resources.food.toFixed(1)+' · Wood '+st.resources.wood.toFixed(1)+' · Stone '+st.resources.stone.toFixed(1)+'<br>Buildings '+t.buildings.filter(b=>b.settlement===st).length+' · Morale developing</small>';selection.classList.add('show')}function inspectCity(t,city){const st=t.settlements.find(q=>q.city===city);selectedCityRef={team:t,settlement:st};selection.innerHTML='<strong style="color:'+t.color+'">'+city.name+'</strong><small>'+city.population+' residents · '+city.houses+' houses · '+city.farms+' farms · '+city.factories+' factories<br>'+city.employment+'% employed · Food '+city.food.toFixed(1)+' · Wood '+city.wood.toFixed(1)+' · Stone '+city.stone.toFixed(1)+'<br>Housing '+city.capacity+' · '+Math.round(city.morale*100)+' morale · '+(city.shortage||'stable')+'<br>Unrest '+(st?.unhappyYears||0).toFixed(1)+' / 10 years</small>';selection.classList.add('show')}
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};cv.setPointerCapture(e.pointerId);cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;cam.x=clamp(drag.cx-dx/cam.z,0,MW);cam.y=clamp(drag.cy-dy/cam.z,0,MH)});
cv.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){const p=worldPoint(e.clientX,e.clientY);let cityHit=null,cityDist=Infinity;for(const t of teams)for(const st of (t.settlements||[])){const d=Math.hypot(p.x-st.x,p.y-st.y);if(d<34/cam.z&&d<cityDist){cityHit={t,city:st.city,settlement:st};cityDist=d}}let hit=-1,bd=Infinity;teams.forEach((t,i)=>{const d=Math.hypot(p.x-t.ball.x,p.y-t.ball.y);if(d<42/cam.z&&d<bd){hit=i;bd=d}});if(cityHit&&cityDist<bd){if(cityHit.city)inspectCity(cityHit.t,cityHit.city);else inspectSettlement(cityHit.t,cityHit.settlement)}else if(hit>=0)inspect(hit);else{selected=-1;selection.classList.remove('show')}}drag=null;cv.classList.remove('drag')});
cv.addEventListener('wheel',e=>{e.preventDefault();const before=worldPoint(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.exp(-e.deltaY*.001),.22,1.8);const after=worldPoint(e.clientX,e.clientY);cam.x+=before.x-after.x;cam.y+=before.y-after.y},{passive:false});
function renderDebug(){stats.innerHTML=teams.map(t=>{const adults=t.civilians.filter(v=>v.stage==='adult'),counts={};for(const v of adults)counts[v.task]=(counts[v.task]||0)+1;const rows=Object.entries(counts).map(([k,n])=>k.toUpperCase()+': '+n).join(' · ');const stuck=adults.filter(v=>(v.stuckFor||0)>3).length;const inv=adults.reduce((a,v)=>({wood:a.wood+(v.inventory?.wood||0),stone:a.stone+(v.inventory?.stone||0),food:a.food+(v.inventory?.food||0)}),{wood:0,stone:0,food:0});return '<div class="row"><span style="color:'+t.color+'">'+t.name+'</span><span>'+t.civilians.length+' people · '+t.resources.wood.toFixed(0)+'W / '+t.resources.stone.toFixed(0)+'S / '+t.resources.food.toFixed(0)+'F</span></div><div style="font-size:10px;color:#c4d4c6;line-height:1.7;padding:5px 0">'+rows+'<br>Carried W '+inv.wood.toFixed(1)+' · S '+inv.stone.toFixed(1)+' · F '+inv.food.toFixed(1)+' · Stuck '+stuck+'<br>Built '+t.buildings.filter(b=>b.progress>=1).length+' · Under construction '+t.buildings.filter(b=>b.progress>0&&b.progress<1).length+'</div>'}).join('')+'<div style="font-size:10px;color:#a9e0bd;margin-top:8px">DEBUG '+(debugEnabled?'ON':'OFF')+' · Press D to toggle civilian labels</div>'}document.getElementById('gear').onclick=()=>{panel.classList.toggle('open');renderDebug()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='d'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){debugEnabled=!debugEnabled;if(panel.classList.contains('open'))renderDebug()}});
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume simulation':'Pause simulation'};document.querySelectorAll('#speedbar button').forEach(b=>b.onclick=()=>{simulationSpeed=Number(b.dataset.speed);document.querySelectorAll('#speedbar button').forEach(q=>q.classList.toggle('active',q===b))});
document.getElementById('reset').onclick=init;document.getElementById('orderHouse').onclick=()=>{const t=selectedCityRef?.team||(selected>=0?teams[selected]:teams[0]),st=selectedCityRef?.settlement||null;if(t&&createBuilding(t,'house',st))notify('Housing blueprint placed. Workers must complete it.');else notify('Housing order rejected: suitable land or materials unavailable.')};addEventListener('resize',resize);init();resize();requestAnimationFrame(frame);
})();
</script></body></html>
